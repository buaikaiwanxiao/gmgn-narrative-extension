<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>body{width:330px;background:#161820;color:#e9eaf0;font:13px Arial,'Microsoft YaHei',sans-serif;padding:15px;margin:0}h2{font-size:17px;margin:0 0 13px}label{display:block;margin:10px 0}input[type=password],textarea{box-sizing:border-box;width:100%;padding:8px;background:#232631;border:1px solid #444858;color:#fff;border-radius:5px}textarea{height:76px;resize:vertical}small{display:block;color:#a9adbc;line-height:1.5}button{border:0;border-radius:5px;padding:8px 12px;background:#4a55c0;color:white;cursor:pointer;margin:10px 6px 0 0}#clear{background:#424651}a{color:#aab5ff}#status{color:#b2efcb;margin-top:10px}</style></head><body><h2>GMGN 叙事雷达 · v0.5.2</h2><div id="firstRun" style="display:none;background:#3b2f0b;border:1px solid #f0b90b;color:#ffe08a;border-radius:6px;padding:9px 10px;margin:0 0 10px;line-height:1.6">首次使用：填「服务地址」和「访问密钥」（找管理员要），点「测试连接」，显示连接正常就好了。以后升级插件不用重新填。</div><label><input type="checkbox" id="enabled" checked> 显示标记</label><label><input type="checkbox" id="auto"> 自动查同名历史（可选官方 API）</label><input id="key" type="password" placeholder="GMGN API Key（留空保留原值）" autocomplete="off"><small>仅发送查询词给 GMGN 官方接口，不需要私钥。限速 5 次/分钟；不保证搜索覆盖全链。</small><label>服务地址（叙事索引）</label><input id="indexUrl" type="text" placeholder="https://你的服务地址（找管理员要）" style="box-sizing:border-box;width:100%;padding:8px;background:#232631;border:1px solid #444858;color:#fff;border-radius:5px"><small>填管理员给你的 HTTPS 地址。也可以填本地隧道 http://127.0.0.1:18777（ssh -N -L 18777:127.0.0.1:18777 用户@VPS），本地不需要密钥。清空＝不用索引。</small><label>访问密钥</label><input id="idxKey" type="password" placeholder="粘贴你的访问密钥（留空保留原值）" autocomplete="off"><small id="idxKeyState"></small><button id="ping">测试连接</button><button id="rmIdxKey" style="background:#424651">删除访问密钥</button><div id="pingStatus" style="margin-top:8px;color:#b2efcb"></div><label>同叙事别名（一行一组）</label><textarea id="aliases" placeholder="旺旺=wangwang=justiceforwangwang"></textarea><small>仅同链合并；默认按同名 ticker，别名由你定义。新? = 历史未确认。</small><button id="save">保存设置</button><button id="clear">清空本地记录</button><button id="remove">删除 API Key</button><div id="status"></div><script src="popup.js"></script></body></html>
